name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一ブランチで新しい push があれば実行中のジョブを止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck / test / build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # postinstall の `wxt prepare` が .wxt/ の型とパスエイリアスを生成する。
      # これが無いと typecheck が落ちるため、install は必ず最初に走らせる。
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
